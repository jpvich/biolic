[package]
name = "biolic"
version = "0.1.1"
edition = "2021"
rust-version = "1.89"
authors = ["jpvich"]
license = "MIT OR Apache-2.0"
description = "biolic (Bioinformatics Integrated Operations Library for IO & Computation): a fast, modular, streaming bioinformatics toolkit in Rust for sequencing data (FASTQ/FASTA/BAM), with strong long-read support"
repository = "https://github.com/jpvich/biolic"
homepage = "https://github.com/jpvich/biolic"
documentation = "https://docs.rs/biolic"
readme = "README.md"
keywords = ["bioinformatics", "genomics", "fastq", "bam", "long-reads"]
categories = ["command-line-utilities", "science"]
# Keep internal planning docs out of the public crate.
# (crates.io packages are public and permanent.)
exclude = ["biolic_plan.md", "prd/", ".github/", "conda-recipe/"]

[[bin]]
name = "biolic"
path = "src/main.rs"

[lib]
name = "biolic"
path = "src/lib.rs"

[features]
# Default build is pure-Rust + fully static (gzip only), per decision D3.
default = []
# Opt-in bzip2/xz/zstd support. Pulls in C libraries (libbz2/liblzma), so it is
# NOT part of the default download-and-run binary.
extra-compression = ["dep:niffler"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Sequence parsing — noodles is the sole parser (D2).
# fastq + fasta + unaligned BAM (M1). bam pulls in bgzf + sam (header/records).
noodles = { version = "0.111", features = ["fastq", "fasta", "bam", "sam", "bgzf"] }

# Compression — pure-Rust gzip for the default static build (D3).
flate2 = "1.0"
# bz2/xz/zstd auto-detection, only under the extra-compression feature (D3).
niffler = { version = "3.0", optional = true }

# Parallelism
rayon = "1.10"

# Random sampling
rand = "0.10"

# Pattern search (grep): multi-pattern exact matching + regular expressions.
# Both are already in the dependency tree (via noodles/clap), so these add no
# meaningful build cost.
aho-corasick = "1"
# Floor at 1.12 (well above the 1.5.5 fix for RUSTSEC-2022-0013) so the version
# range cannot resolve a vulnerable regex; the lock already uses 1.12.x.
regex = "1.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Progress bars
indicatif = "0.18"

# Interactive REPL (entered on no-subcommand TTY runs) and command-line tokenizing
reedline = "0.48"
shlex = "2.0"

# Shell-completion script generation (`biolic completions <shell>`)
clap_complete = "4.5"

# NOTE: chrono, uuid, rusqlite, statrs, directories are deferred until the
# `qc` and `logs` modules are implemented (Milestone 3), to keep the default
# build lean and fast. Re-add them (feature-gated where possible) at that point.

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
criterion = "0.5"

[[bench]]
name = "stats_bench"
harness = false

[[test]]
name = "cli_tests"
path = "tests/integration/cli_tests.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
lto = "thin"
